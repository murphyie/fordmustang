kind = "web"
previewPath = "/"
title = "Keyboard Launch"
version = "1.0.0"
id = "artifacts/keyboard-hero"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25189

[services.development]
run = "pnpm --filter @workspace/keyboard-hero run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/keyboard-hero", "run", "build" ]
publicDir = "artifacts/keyboard-hero/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25189"
BASE_PATH = "/"
